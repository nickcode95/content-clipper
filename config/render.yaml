width: 1080
height: 1920
fps: 30
video: {codec: libx264, preset: veryfast, crf: 20, pix_fmt: yuv420p}
audio: {codec: aac, bitrate: 160k, loudnorm: "I=-14:TP=-1.5:LRA=11"}
captions:
  font: "DejaVu Sans"
  bold: true
  size: 72
  highlight_color: "#FFD400"
  max_words_per_line: 4
  safe_top_pct: 10       # platform UI covers the top 10% and bottom 20%: no text there
  safe_bottom_pct: 20
hook: {seconds: 0, size: 64}   # seconds: 0 = show the hook for the whole clip
layout:
  mode: band             # band: full-width video in the middle, text bands above and below
  background: blur       # blur = blurred, darkened copy of the video | color
  background_color: "#111111"
  video_center_y: 0.45   # vertical centre of the video, as a fraction of the canvas height
  hook_position: below   # below | above the video; captions go in the other band
  # crop: full-screen 9:16 cut that follows the action shot by shot; captions only, no hook.
  # Render it with `render ... --layout crop` (files get a .crop suffix).
  crop_caption_y: 0.68   # crop layout: vertical centre of the captions (fraction of height)
music: {gain_db: -18, duck: true, fade_s: 1.0}
