[project]
name = "content-clipper"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nick", email = "nicholasm.marie@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.7.0",
    "faster-whisper>=1.2.1",
    "google-api-python-client>=2.201.0",
    "google-genai>=3.0.0",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=13.0.0",
    "pydantic>=2.14.3",
    "pysubs2>=1.9.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "tenacity>=9.1.4",
    "typer>=0.29.0",
]

[project.scripts]
content-clipper = "content_clipper.cli:app"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
